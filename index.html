stamp-label{color:#e8fff7;font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}.stamp-row{display:flex;gap:8px;justify-content:space-between}.seal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:transparent;border:3px dashed #c5e8dc;color:#c5e8dc;font-weight:800;pointer-events:none}.seal.on{background:#c23b22;border:3px solid #8b1e10;color:#fff6e5;box-shadow:inset 0 -4px #0003}.tables{display:flex;flex-direction:column;gap:10px}.table-card{background:var(--paper);border-radius:18px;padding:10px;box-shadow:var(--shadow)}.table-card.player header{color:#c9184a}.table-card.rival header{color:#0f7a72}.table-card header{font-weight:800;font-size:18px;margin-bottom:8px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fact{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#fff;border-radius:12px;padding:4px 6px}.eq{font-size:20px;font-weight:800}.slot{width:58px;height:58px;border-radius:14px;border:3px dashed #1d3557;background:#fff;font-size:22px;font-weight:800;color:var(--ink);font-family:inherit}.slot.filled{border-style:solid;background:#b9fbc0}.slot.shake{animation:shake .4s;background:#ffcad4}@keyframes shake{0%,to{transform:translate(0)}25%{transform:translate(-6px)}75%{transform:translate(6px)}}.hint{margin:0;padding:10px;background:#fff3b0;color:var(--ink);border-radius:12px;font-size:18px;font-weight:700}.pouch-wrap{background:#6d4c41;border-radius:18px;padding:10px;color:#fff}.pouch-label{font-weight:800;margin-bottom:6px}.pouch{display:flex;flex-wrap:wrap;gap:8px;min-height:64px}.pouch-empty{opacity:.85;font-size:16px}.pouch-pin{width:64px;height:64px;border-radius:50%;border:4px solid #fff6e5;background:#ff8a5b;color:var(--ink);font-size:22px;font-weight:800;font-family:inherit}.pouch-pin.selected{outline:4px solid #ffd166;transform:translateY(-4px)}.overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:#0d3c3c8c;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.card{background:var(--paper);border-radius:28px;padding:24px;width:min(560px,100%);text-align:center;box-shadow:var(--shadow)}.card h2{margin:8px 0;font-size:36px}.wax{width:110px;height:110px;margin:0 auto 8px;border-radius:50%;background:#c23b22;color:#ffd166;display:grid;place-items:center;font-size:48px;box-shadow:inset 0 -8px #00000026}.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}.closet-card{width:min(720px,100%);max-height:100%;overflow:auto}.closet-note{margin-top:0}#closet-preview{width:180px;height:210px;border-radius:20px;background:#fff}.closet-slots{display:grid;gap:12px;text-align:left}.choice-row{display:flex;flex-wrap:wrap;gap:8px}.choice{min-height:56px;padding:8px 14px;border-radius:14px;border:0;background:#fff;font-size:18px;font-weight:700;font-family:inherit;box-shadow:0 4px #1d35571f}.choice.selected{background:var(--sun)}.choice.locked{background:#d9d3c7;color:#7a6a4e}@media(max-width:860px){#game-screen{grid-template-columns:1fr;grid-template-rows:minmax(42vh,1fr) minmax(38vh,auto)}.facts{grid-template-columns:1fr 1fr}.slot{width:52px;height:52px}}
</style>
  </head>
  <body>
    <div id="app">
      <section id="title-screen" class="screen">
        <div class="title-sun" aria-hidden="true"></div>
        <h1 class="logo">LaaBol</h1>
        <p class="tagline">Hunt the numbers on Toy Island</p>
        <p class="subtag">One tablet · No timer · No accounts</p>
        <button id="play-btn" class="big-btn play">Play</button>
        <button id="title-closet-btn" class="big-btn ghost" hidden>Closet</button>
        <p id="progress-line" class="progress-line"></p>
      </section>

      <section id="game-screen" class="screen" hidden>
        <div id="world-wrap">
          <canvas id="world" width="1000" height="720"></canvas>
          <div id="speech" hidden></div>
          <div id="toast" hidden></div>
        </div>
        <aside id="hud">
          <div class="stamp-block">
            <div class="stamp-label">Stamps</div>
            <div id="stamp-row" class="stamp-row"></div>
          </div>
          <p id="hint" class="hint" hidden></p>
          <div id="tables" class="tables"></div>
          <div class="pouch-wrap">
            <div class="pouch-label">Pouch</div>
            <div id="pouch" class="pouch"></div>
          </div>
        </aside>
      </section>

      <section id="stamp-screen" class="screen overlay" hidden>
        <div class="card celebrate">
          <div id="wax-stamp" class="wax">★</div>
          <h2 id="stamp-title">Table stamped!</h2>
          <p id="stamp-unlock"></p>
          <div class="btn-row">
            <button id="stamp-closet-btn" class="big-btn ghost">Closet</button>
            <button id="next-hunt-btn" class="big-btn play">Next hunt</button>
          </div>
        </div>
      </section>

      <section id="rival-result-screen" class="screen overlay" hidden>
        <div class="card celebrate">
          <h2 id="rival-result-title">Race over</h2>
          <p id="rival-result-body"></p>
          <div class="btn-row">
            <button id="result-closet-btn" class="big-btn ghost">Closet</button>
            <button id="rematch-btn" class="big-btn play">Try again</button>
          </div>
        </div>
      </section>

      <section id="closet-screen" class="screen overlay" hidden>
        <div class="card closet-card">
          <h2>Closet</h2>
          <p class="closet-note">Looks only — same speed, same hunt.</p>
          <canvas id="closet-preview" width="280" height="320"></canvas>
          <div class="closet-slots">
            <div>
              <h3>Hat</h3>
              <div id="hat-choices" class="choice-row"></div>
            </div>
            <div>
              <h3>Top</h3>
              <div id="top-choices" class="choice-row"></div>
            </div>
            <div>
              <h3>Shoes</h3>
              <div id="shoe-choices" class="choice-row"></div>
            </div>
          </div>
          <button id="closet-done-btn" class="big-btn play">Looks great!</button>
        </div>
      </section>
    </div>
  </body>
</html>
